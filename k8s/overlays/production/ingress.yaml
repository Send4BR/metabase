apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: metabase
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
  - host: metabase.send4.com.br
    http:
      paths:
      - backend:
          serviceName: metabase
          servicePort: 80
        path: /
  tls:
  - hosts:
    - metabase.send4.com.br
    secretName: metabase-send4-com-br-tls